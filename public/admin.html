<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mod Auth Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .card {
      background: #1a1f29;
      border: 1px solid #2b3240;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a4354;
      background: #0f1115;
      color: white;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 6px;
      font-weight: bold;
    }

    .btn-add { background: #2e8b57; color: white; }
    .btn-refresh { background: #3b82f6; color: white; }
    .btn-enable { background: #22c55e; color: white; }
    .btn-revoke { background: #ef4444; color: white; }
    .btn-remove { background: #f97316; color: white; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border-bottom: 1px solid #2b3240; }
    th { background: #141922; text-align: left; }

    .status-enabled { color: #22c55e; font-weight: bold; }
    .status-revoked { color: #ef4444; font-weight: bold; }

    code { color: #93c5fd; font-size: 11px; opacity: 0.7; }
    .layout {
  display: flex;
  gap: 20px;
  max-width: 1400px;
  margin: 0 auto;
  align-items: flex-start;
}

/* LEFT SIDE (main content) */
.main {
  flex: 3;
}

/* RIGHT SIDE (online panel) */
.sidebar {
  flex: 1;
  position: sticky;
  top: 20px;
  height: calc(100vh - 40px);
  overflow-y: auto;
}

/* make online table compact */
.sidebar table {
  font-size: 12px;
}

.sidebar th,
.sidebar td {
  padding: 8px;
}
  </style>
</head>

<body>
<div class="layout">

  <!-- LEFT SIDE -->
  <div class="main">

    <h1>Mod Auth Admin Panel</h1>

    <!-- LOGIN -->
    <div class="card" id="loginBox">
      <input id="pw" type="password" placeholder="Admin password" />
      <button onclick="login()">Login</button>
    </div>

    <!-- ADD HWID -->
    <div class="card">
      <h3>Add Token</h3>
      <input id="usernameInput" placeholder="Username" />
      <input id="hwidInput" placeholder="Token" />
      <button class="btn-add" onclick="addHWID()">Add</button>
      <button class="btn-refresh" onclick="loadAll()">Refresh</button>
    </div>

    <!-- LOGS -->
    <div class="card">
      <h3>Admin Logs</h3>
      <button class="btn-revoke" onclick="clearLogs()">Clear Logs</button>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Action</th>
            <th>Details</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="logs"></tbody>
      </table>
    </div>

    <!-- HWIDS -->
    <div class="card">
      <h3>Token's</h3>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>User</th>
            <th>Status</th>
            <th>Created</th>
            <th>Last Seen</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="hwids"></tbody>
      </table>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="sidebar">

    <div class="card">
      <h3>Users</h3>
      <button class="btn-refresh" onclick="loadOnline()">Refresh</button>

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Status</th>
            <th>Last Seen</th>
          </tr>
        </thead>
        <tbody id="online"></tbody>
      </table>
    </div>

  </div>

</div>

<script>
const API = "";
const TOKEN_KEY = "admin_token";

/* ======================
   AUTH HEADER FIX
====================== */
function authHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": localStorage.getItem(TOKEN_KEY)
  };
}

function requireLogin() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    alert("Please login first");
    throw new Error("No token");
  }
  return token;
}

function formatTime(value) {
  if (!value) return "never";

  const date = new Date(value);
  if (isNaN(date.getTime())) return "invalid";

  return date.toLocaleString(); // clean readable format
}

function timeAgo(value) {
  if (!value) return "never";

  const date = new Date(value);
  const diff = Date.now() - date.getTime();

  const sec = Math.floor(diff / 1000);
  if (sec < 10) return "just now";
  if (sec < 60) return sec + "s ago";
  if (sec < 3600) return Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
  return Math.floor(sec / 86400) + "d ago";
}

/* ======================
   LOGIN
====================== */

async function loadOnline() {
  requireLogin();

  const res = await fetch("/admin/list-hwids", {
    headers: authHeaders()
  });

  const data = await res.json();
  const tbody = document.getElementById("online");
  tbody.innerHTML = "";

  if (!data.success) return;

  data.users.forEach(u => {
    const lastSeenTime = u.last_seen ? new Date(u.last_seen).getTime() : null;

    const isOnline =
      lastSeenTime && (Date.now() - lastSeenTime < 20000);

    tbody.innerHTML += `
      <tr>
        <td>${u.username || "unknown"}</td>

        <td style="color:${isOnline ? "#22c55e" : "#ef4444"}; font-weight:bold;">
          ${isOnline ? "Online" : "Offline"}
        </td>

        <td>${timeAgo(u.last_seen)}</td>
      </tr>
    `;
  });
}

async function login() {
  const password = document.getElementById("pw").value;

  const res = await fetch("/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password })
  });

  const data = await res.json();

  if (data.success) {
    localStorage.setItem(TOKEN_KEY, data.token);
    document.getElementById("loginBox").style.display = "none";
    loadAll();
  } else {
    alert("Wrong password");
  }
}

/* ======================
   LOAD ALL DATA
====================== */
async function loadAll() {
  await loadHWIDs();
  await loadLogs();
}

/* ======================
   LOGS FIXED
====================== */
async function loadLogs() {
  requireLogin();

  const res = await fetch("/admin/logs", {
    headers: authHeaders()
  });

  const data = await res.json();

  const tbody = document.getElementById("logs");
  tbody.innerHTML = "";

  if (!data.success) return;

  data.logs.forEach(l => {
    tbody.innerHTML += `
      <tr>
        <td>${l.id}</td>
        <td>${l.action}</td>
        <td>${l.details}</td>
        <td>${formatTime(l.created_at)}</td>
      </tr>
    `;
  });
}

// remove logs
async function clearLogs() {
  requireLogin();

  if (!confirm("Are you sure you want to delete ALL logs? This cannot be undone.")) return;

  const res = await fetch("/admin/clear-logs", {
    method: "POST",
    headers: authHeaders()
  });

  const data = await res.json();

  alert(data.message);
  loadLogs();
}

/* ======================
   HWIDS FIXED
====================== */
async function loadHWIDs() {
  requireLogin();

  const res = await fetch("/admin/list-hwids", {
    headers: authHeaders()
  });

  const data = await res.json();

  const tbody = document.getElementById("hwids");
  tbody.innerHTML = "";

  if (!data.success) return;

  data.users.forEach(u => {
    tbody.innerHTML += `
      <tr>
  <td>${u.id}</td>
  <td>${u.username || "N/A"}</td>

  <td class="${u.access_enabled === 1 ? "status-enabled" : "status-revoked"}">
    ${u.access_enabled === 1 ? "Enabled" : "Revoked"}
  </td>

  <td>${formatTime(u.created_at)}</td>
<td>${timeAgo(u.last_seen)}</td>

  <td>
    <button onclick="enableHWID('${u.hwid}')">Enable</button>
    <button onclick="revokeHWID('${u.hwid}')">Revoke</button>
    <button onclick="removeHWID('${u.hwid}')">Remove</button>
  </td>
</tr>
    `;
  });
}

/* ======================
   ACTIONS FIXED
====================== */
async function addHWID() {
  requireLogin();

  const hwid = document.getElementById("hwidInput").value;
  const username = document.getElementById("usernameInput").value;

  const res = await fetch("/admin/add-hwid", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ hwid, username })
  });

  const data = await res.json();
  alert(data.message);
  loadHWIDs();
}

async function removeHWID(hwid) {
  requireLogin();

  await fetch("/admin/remove-hwid", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ hwid })
  });

  loadHWIDs();
}

async function revokeHWID(hwid) {
  requireLogin();

  await fetch("/admin/revoke-hwid", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ hwid })
  });

  loadHWIDs();
}

async function enableHWID(hwid) {
  requireLogin();

  await fetch("/admin/enable-hwid", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ hwid })
  });

  loadHWIDs();
}

setInterval(() => {
  if (localStorage.getItem(TOKEN_KEY)) {
    loadOnline();
  }
}, 3000);

// IMPORTANT: initial load
if (localStorage.getItem(TOKEN_KEY)) {
  loadOnline();
}

/* ======================
   AUTO LOAD IF LOGGED IN
====================== */
if (localStorage.getItem(TOKEN_KEY)) {
  document.getElementById("loginBox").style.display = "none";
  loadAll();
}
</script>

</body>
</html>
